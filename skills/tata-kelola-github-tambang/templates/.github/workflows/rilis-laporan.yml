# Rilis laporan resmi (RKAB, SDC, desain final). Membuat DRAFT release + aset + MANIFEST.sha256;
# Maintainer (CPI/KTT) mempublikasikan secara manual => menjadi immutable (aktifkan release immutability di setelan repo/org).
name: rilis-laporan
on:
  push:
    tags: ["rkab-*", "sdc-*", "desain-*", "v*"]
permissions:
  contents: write
jobs:
  bangun:
    runs-on: ubuntu-latest
    environment: rilis
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Bangun ulang laporan secara reproducible
        run: make laporan TAG=${GITHUB_REF_NAME}    # target Makefile proyek menulis ke dist/
      - name: Lingkungan & checksum
        run: |
          pip freeze > dist/environment.lock
          git rev-parse HEAD > dist/COMMIT
          (cd dist && sha256sum * > MANIFEST.sha256)
      - name: Draft release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file dist/CATATAN_RILIS.md
